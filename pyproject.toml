[project]
name = "pacman"
version = "0.1.0"
description = "Recreate the Pac-Man arcade Game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arcade>=3.3.3",
    "mazegenerator",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
]
authors = [
	{name = "roandrie", email = "roandrie@student.42lehavre.fr"},
	{name = "anacharp", email = "anacharp@student.42lehavre.fr"}
]
license = "MIT"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
pacman-game = "src.main:main"

[tool.uv.sources]
mazegenerator = { path = "mazegenerator/mazegenerator-2.0.2-py3-none-any.whl" }

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"
